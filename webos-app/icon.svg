<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
<!-- FW Block: "#block" in the LG-USB-2-ETH0 family (window dots, a colored
     "#", a cursor), in FW Block's red.  The PNGs are rendered from this. -->
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="0.4" y2="1">
    <stop offset="0" stop-color="#1b2120"/><stop offset="1" stop-color="#0e1110"/>
  </linearGradient>
  <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect x="2" y="2" width="508" height="508" rx="116" fill="url(#bg)" stroke="#2a3130" stroke-width="3"/>
<circle cx="118" cy="122" r="17" fill="#ef5350"/>
<circle cx="168" cy="122" r="17" fill="#f5a623"/>
<circle cx="218" cy="122" r="17" fill="#2ec866"/>
<text x="77" y="300" font-family="DejaVu Sans Mono, monospace" font-weight="700" font-size="99.1" filter="url(#soft)"><tspan fill="#ff2d55">#</tspan><tspan fill="#f4f1f2">block</tspan></text>
<rect x="81" y="330" width="50.7" height="15" rx="4" fill="#ff2d55" filter="url(#soft)"/>
</svg>
