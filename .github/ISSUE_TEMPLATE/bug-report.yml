name: Bug report
description: Something in FW Block doesn't work the way it should
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting it.  The quickest way to fill in the report below: in the TV app, choose **Help and report**.  It has no IP addresses or names in it.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did (which button or command), what you expected, and what happened instead.
    validations:
      required: true
  - type: input
    id: tv
    attributes:
      label: TV model, webOS version and firmware
      placeholder: OLED65C2PUA, webOS 25 (10.3.1), firmware 43.21.77
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where
      options:
        - The TV app
        - fw-block.sh over SSH or telnet
        - After a restart (the startup hook)
        - The 10-minute check
    validations:
      required: true
  - type: textarea
    id: report
    attributes:
      label: The report
      description: From **Help and report** in the app, or `sh fw-block.sh report` on the TV.
      render: text
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Anything else
      description: Error messages, screenshots, or an update notice you saw (what it said, and when).
