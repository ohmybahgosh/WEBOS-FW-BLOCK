<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="510" viewBox="0 0 1280 510" role="img" aria-labelledby="t d">
  <title id="t">How WEBOS-FW-BLOCK blocks firmware updates</title>
  <desc id="d">The webOS updater has to get past four blocks to reach LG: its update checks are off, an update it already found is deleted, the seven update servers go nowhere in /etc/hosts, and the address it uses without a name, 156.147.69.32, is dropped by a firewall rule.  The side doors are closed too: LG Remote Support's servers and addresses are blocked, and any download that starts anyway is cancelled within 30 seconds.  Every 10 minutes and at every start, all six are checked and put back.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a0607"/><stop offset="1" stop-color="#170a0e"/></linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.6"><stop offset="0" stop-color="#ff2d55" stop-opacity="0.13"/><stop offset="1" stop-color="#ff2d55" stop-opacity="0"/></radialGradient>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#ffffff" fill-opacity="0.03"/></pattern>
    <style>
      .flow { stroke-dasharray: 8 8; animation: flow 1s linear infinite; }
      @keyframes flow { to { stroke-dashoffset: -16; } }
      .pulse { animation: pulse 2.4s ease-in-out infinite; }
      @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }
      @media (prefers-reduced-motion: reduce) { .flow, .pulse { animation: none; } }
    </style>
  </defs>
  <rect width="1280" height="510" rx="18" fill="url(#bg)"/>
  <rect width="1280" height="510" rx="18" fill="url(#glow)"/>
  <text xml:space="preserve" x="52" y="64" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="22" font-weight="800" fill="#ffffff"><tspan fill="#ff2d55">&gt; </tspan>every route to a firmware update, closed</text>
  <rect x="52" y="110" width="176" height="140" rx="14" fill="#140b0d" stroke="#6f5f63" stroke-opacity="0.9"/><text xml:space="preserve" x="66" y="140" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="15" font-weight="700" fill="#f2e9ea">webOS updater</text><text xml:space="preserve" x="66" y="168" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="12.5" fill="#b3a2a6">/usr/sbin/update</text><text xml:space="preserve" x="66" y="190" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#b3a2a6">asks LG for updates</text><line x1="230" y1="180" x2="250" y2="180" stroke="#ff2d55" stroke-width="3" class="flow"/><rect x="252" y="110" width="176" height="140" rx="14" fill="#140b0d" stroke="#ff2d55" stroke-opacity="0.9"/><text xml:space="preserve" x="266" y="140" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="15" font-weight="700" fill="#f2e9ea">1  update checks</text><text xml:space="preserve" x="266" y="168" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="12.5" fill="#ff2d55">softwareUpdateEnable</text><text xml:space="preserve" x="266" y="190" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#b3a2a6">+ automaticUpdate: off</text><rect x="266" y="208" width="50" height="28" rx="7" fill="#ff2d55" fill-opacity="0.16" stroke="#ff2d55" stroke-opacity="0.7"/><text xml:space="preserve" x="276" y="227" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="14" font-weight="700" fill="#ff2d55" class="pulse">OFF</text><line x1="430" y1="180" x2="450" y2="180" stroke="#ff2d55" stroke-width="3" class="flow"/><circle cx="440.0" cy="180" r="11" fill="#0a0607" stroke="#ff2d55" stroke-width="2.5"/><path d="M435.0 175l10 10m0 -10l-10 10" stroke="#ff2d55" stroke-width="2.5" stroke-linecap="round"/><rect x="452" y="110" width="176" height="140" rx="14" fill="#140b0d" stroke="#ff2d55" stroke-opacity="0.9"/><text xml:space="preserve" x="466" y="140" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="15" font-weight="700" fill="#f2e9ea">2  found updates</text><text xml:space="preserve" x="466" y="168" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="12.5" fill="#ff2d55">Image_Update_Info.xml</text><text xml:space="preserve" x="466" y="190" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#b3a2a6">deleted before install</text><rect x="466" y="208" width="60" height="28" rx="7" fill="#ff2d55" fill-opacity="0.16" stroke="#ff2d55" stroke-opacity="0.7"/><text xml:space="preserve" x="476" y="227" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="14" font-weight="700" fill="#ff2d55" class="pulse">GONE</text><line x1="630" y1="180" x2="650" y2="180" stroke="#ff2d55" stroke-width="3" class="flow"/><circle cx="640.0" cy="180" r="11" fill="#0a0607" stroke="#ff2d55" stroke-width="2.5"/><path d="M635.0 175l10 10m0 -10l-10 10" stroke="#ff2d55" stroke-width="2.5" stroke-linecap="round"/><rect x="652" y="110" width="176" height="140" rx="14" fill="#140b0d" stroke="#ff2d55" stroke-opacity="0.9"/><text xml:space="preserve" x="666" y="140" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="15" font-weight="700" fill="#f2e9ea">3  update servers</text><text xml:space="preserve" x="666" y="168" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="12.5" fill="#ff2d55">snu su su-ssl su-dev</text><text xml:space="preserve" x="666" y="190" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#b3a2a6">snu-dev nsu ngfts</text><rect x="666" y="208" width="90" height="28" rx="7" fill="#ff2d55" fill-opacity="0.16" stroke="#ff2d55" stroke-opacity="0.7"/><text xml:space="preserve" x="676" y="227" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="14" font-weight="700" fill="#ff2d55" class="pulse">0.0.0.0</text><line x1="830" y1="180" x2="850" y2="180" stroke="#ff2d55" stroke-width="3" class="flow"/><circle cx="840.0" cy="180" r="11" fill="#0a0607" stroke="#ff2d55" stroke-width="2.5"/><path d="M835.0 175l10 10m0 -10l-10 10" stroke="#ff2d55" stroke-width="2.5" stroke-linecap="round"/><rect x="852" y="110" width="176" height="140" rx="14" fill="#140b0d" stroke="#ff2d55" stroke-opacity="0.9"/><text xml:space="preserve" x="866" y="140" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="15" font-weight="700" fill="#f2e9ea">4  no-name address</text><text xml:space="preserve" x="866" y="168" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="12.5" fill="#ff2d55">156.147.69.32</text><text xml:space="preserve" x="866" y="190" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#b3a2a6">its network server</text><rect x="866" y="208" width="60" height="28" rx="7" fill="#ff2d55" fill-opacity="0.16" stroke="#ff2d55" stroke-opacity="0.7"/><text xml:space="preserve" x="876" y="227" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="14" font-weight="700" fill="#ff2d55" class="pulse">DROP</text><line x1="1030" y1="180" x2="1050" y2="180" stroke="#ff2d55" stroke-width="3" class="flow"/><circle cx="1040.0" cy="180" r="11" fill="#0a0607" stroke="#ff2d55" stroke-width="2.5"/><path d="M1035.0 175l10 10m0 -10l-10 10" stroke="#ff2d55" stroke-width="2.5" stroke-linecap="round"/><rect x="1052" y="110" width="176" height="140" rx="14" fill="#140b0d" stroke="#6f5f63" stroke-opacity="0.5"/><text xml:space="preserve" x="1066" y="140" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="15" font-weight="700" fill="#8a7a7e">LG update servers</text><text xml:space="preserve" x="1066" y="168" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="12.5" fill="#b3a2a6">snu.lge.com</text><text xml:space="preserve" x="1066" y="190" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#b3a2a6">never reached</text><path d="M1106.0 232 q0 -16 16 -16 q4 -14 20 -12 q14 -8 24 6 q16 0 16 14 q0 12 -14 12 h-48 q-14 0 -14 -12z" fill="none" stroke="#6f5f63" stroke-width="2"/><rect x="52" y="320" width="176" height="140" rx="14" fill="#140b0d" stroke="#6f5f63" stroke-opacity="0.9"/><text xml:space="preserve" x="66" y="350" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="15" font-weight="700" fill="#f2e9ea">side doors</text><text xml:space="preserve" x="66" y="378" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="12.5" fill="#b3a2a6">remote support,</text><text xml:space="preserve" x="66" y="400" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#b3a2a6">phone app, antenna</text><line x1="230" y1="390" x2="250" y2="390" stroke="#ff2d55" stroke-width="3" class="flow"/><rect x="252" y="320" width="176" height="140" rx="14" fill="#140b0d" stroke="#ff2d55" stroke-opacity="0.9"/><text xml:space="preserve" x="266" y="350" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="15" font-weight="700" fill="#f2e9ea">5  remote support</text><text xml:space="preserve" x="266" y="378" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="12.5" fill="#ff2d55">rone-*.lge.com</text><text xml:space="preserve" x="266" y="400" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#b3a2a6">165.244.62.249 / .99.174</text><rect x="266" y="418" width="70" height="28" rx="7" fill="#ff2d55" fill-opacity="0.16" stroke="#ff2d55" stroke-opacity="0.7"/><text xml:space="preserve" x="276" y="437" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="14" font-weight="700" fill="#ff2d55" class="pulse">BLOCK</text><line x1="430" y1="390" x2="450" y2="390" stroke="#ff2d55" stroke-width="3" class="flow"/><circle cx="440.0" cy="390" r="11" fill="#0a0607" stroke="#ff2d55" stroke-width="2.5"/><path d="M435.0 385l10 10m0 -10l-10 10" stroke="#ff2d55" stroke-width="2.5" stroke-linecap="round"/><rect x="452" y="320" width="176" height="140" rx="14" fill="#140b0d" stroke="#ff2d55" stroke-opacity="0.9"/><text xml:space="preserve" x="466" y="350" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="15" font-weight="700" fill="#f2e9ea">6  phone apps</text><text xml:space="preserve" x="466" y="378" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="12.5" fill="#ff2d55">second screen</text><text xml:space="preserve" x="466" y="400" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#b3a2a6">casting keeps working</text><rect x="466" y="418" width="60" height="28" rx="7" fill="#ff2d55" fill-opacity="0.16" stroke="#ff2d55" stroke-opacity="0.7"/><text xml:space="preserve" x="476" y="437" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="14" font-weight="700" fill="#ff2d55" class="pulse">DENY</text><line x1="630" y1="390" x2="650" y2="390" stroke="#ff2d55" stroke-width="3" class="flow"/><circle cx="640.0" cy="390" r="11" fill="#0a0607" stroke="#ff2d55" stroke-width="2.5"/><path d="M635.0 385l10 10m0 -10l-10 10" stroke="#ff2d55" stroke-width="2.5" stroke-linecap="round"/><rect x="652" y="320" width="176" height="140" rx="14" fill="#140b0d" stroke="#ff2d55" stroke-opacity="0.9"/><text xml:space="preserve" x="666" y="350" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="15" font-weight="700" fill="#f2e9ea">7  any download</text><text xml:space="preserve" x="666" y="378" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="12.5" fill="#ff2d55">every 30 s</text><text xml:space="preserve" x="666" y="400" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#b3a2a6">support, antenna</text><rect x="666" y="418" width="60" height="28" rx="7" fill="#ff2d55" fill-opacity="0.16" stroke="#ff2d55" stroke-opacity="0.7"/><text xml:space="preserve" x="676" y="437" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="14" font-weight="700" fill="#ff2d55" class="pulse">STOP</text><rect x="852" y="330" width="376" height="120" rx="14" fill="#0a0607" stroke="#ff2d55" stroke-opacity="0.5" stroke-dasharray="6 6"/><text xml:space="preserve" x="872" y="362" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, DejaVu Sans Mono, monospace" font-size="15" font-weight="700" fill="#f2e9ea"><tspan fill="#ff2d55">↻ </tspan>every 10 min and every start</text><text xml:space="preserve" x="872" y="388" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#b3a2a6">checks all seven, puts back anything undone.</text><text xml:space="preserve" x="872" y="408" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#b3a2a6">The Homebrew Channel's lines are left alone.</text><text xml:space="preserve" x="872" y="428" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13.5" fill="#b3a2a6">With LG-USB-2-ETH0, it adds only what ETH0 lacks.</text>
