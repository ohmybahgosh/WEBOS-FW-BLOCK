    <radialGradient id="sun" cx="0.5" cy="0.74" r="0.55"><stop offset="0" stop-color="#ff2d55" stop-opacity="0.32"/><stop offset="1" stop-color="#ff2d55" stop-opacity="0"/></radialGradient>
